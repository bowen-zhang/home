events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name [DOMAIN] www.[DOMAIN];

        ssl_certificate /etc/letsencrypt/live/[DOMAIN]/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/[DOMAIN]/privkey.pem; # managed by Certbot

        # SSL protocols & ciphers (replaces options-ssl-nginx.conf)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Optional: SSL Session caching
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        location /api/ {
            proxy_pass http://[API_HOSTNAME]:[API_PORT]/;
            proxy_http_version 1.1;             # required for streaming
            proxy_buffering off;                # recommended for streaming
            proxy_request_buffering off;        # recommended for streaming 
            proxy_pass_trailers on;             # required for gRPC
        }

        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name [DOMAIN] www.[DOMAIN];

        return 301 https://$host$request_uri;
    }
}
